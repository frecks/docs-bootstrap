# Vale enforces doc-standards/style-guide.md.
# Google is the upstream style, pinned to a release. DocsBootstrap holds our own rules.
# Bump the Google version deliberately; see doc-standards/README.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = DocsBootstrap

Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, DocsBootstrap

# Hostnames, package names, and tool names make spell checking noisy. Product
# capitalization is still enforced through Vale.Terms and the DocsBootstrap vocabulary.
Vale.Spelling = NO

# Flags commas before phrases that aren't lists, which is most of what it
# reports. Serial commas are still required, and review-checklist.md covers
# them.
Google.OxfordComma = NO

# Google allows "we" for the people who maintain a project, when it's clear who
# that is. As a suggestion, the rule points out each use for review without
# blocking it. See doc-standards/style-guide.md.
Google.We = suggestion

# Flags abbreviations such as VM and DNS in headings, which Google's guide
# keeps in capitals. DocsBootstrap.Headings replaces it.
Google.Headings = NO

# Asks to spell out abbreviations every reader knows, such as DNS, and accepts a
# definition only in title case, which Google's guide says not to use.
# DocsBootstrap.Acronyms replaces it.
Google.Acronyms = NO

# Flags abbreviations such as NAT after a colon, which keep their capitals.
# DocsBootstrap.Colons replaces it.
Google.Colons = NO

# Reads a version number such as 2.7.3.1042 as a date, and asks for dates
# such as "July 31, 2016" instead of ISO 8601. DocsBootstrap.DateFormat replaces it.
Google.DateFormat = NO

# Flags any form of "be" before a past participle, but Google's guide allows
# the passive for history, states, and when the actor doesn't matter, which
# is most of what these pages describe. Review checks voice instead.
Google.Passive = NO

# DocsBootstrap.Contractions keeps only the negations, DocsBootstrap.Semicolons and
# DocsBootstrap.Parens skip table cells, and DocsBootstrap.Parens also skips abbreviation
# definitions. Each file says why.
Google.Contractions = NO
Google.Semicolons = NO
Google.Parens = NO

# The standards quote bad examples on purpose, and templates hold placeholders.
# markdownlint still checks them.
[doc-standards/**/*.md]
BasedOnStyles =

# The rationale is prose like any page in docs/, with no bad examples.
[doc-standards/rationale.md]
BasedOnStyles = Vale, Google, DocsBootstrap
Vale.Spelling = NO
Google.OxfordComma = NO
Google.We = suggestion
Google.Headings = NO
Google.Acronyms = NO
Google.Colons = NO
Google.DateFormat = NO
Google.Passive = NO
Google.Contractions = NO
Google.Semicolons = NO
Google.Parens = NO
