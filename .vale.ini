# Vale enforces docs/standards/style-guide.md.
# Google is the upstream style, pinned to a release. DocsBootstrap holds our own rules.
# Bump the Google version deliberately; see docs/standards/README.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = DocsBootstrap

Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, DocsBootstrap

# Hostnames, package names, and tool names make spell checking noisy. Product
# capitalization is still enforced through Vale.Terms and the DocsBootstrap vocabulary.
Vale.Spelling = NO

# Flags commas before clauses that aren't lists, which forces needless rewrites.
# Serial commas are still required; review-checklist.md covers them.
Google.OxfordComma = suggestion

# Explanation pages allow "we" through a <!-- vale Google.We = NO --> comment,
# which the explanation template includes. Vale can't read a page's type from
# frontmatter, so it can't be set here.

# The standards quote bad examples on purpose, and templates hold placeholders.
# markdownlint still checks them.
[docs/standards/**/*.md]
BasedOnStyles =
