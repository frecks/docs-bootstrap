extends: existence
message: "Finish or remove '%s' before publishing."
link: doc-standards/style-guide.md#drafts
level: error
scope: raw
tokens:
  - '\bTODO\b'
  - '\bTBD\b'
  - '\bFIXME\b'
  - '\bXXX\b'
