extends: existence
message: "This looks like a secret. Replace it with a placeholder such as PRIVATE_KEY and say where the real value is stored."
link: docs/standards/style-guide.md#secrets
level: error
scope: raw
nonword: true
tokens:
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  - '(?i)\b(?:password|passwd|secret|api[_-]?key|token)\s*[:=]\s*["'']?[^\s"''<>]{8,}'
