extends: existence
message: "This looks like a secret. Replace it with a placeholder such as PRIVATE_KEY and say where the real value is stored."
link: docs/standards/style-guide.md#secrets
level: error
scope: raw
nonword: true
tokens:
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  # Uppercase placeholders, such as API_TOKEN, aren't secrets. (?-i:...) keeps
  # that test case-sensitive, so lowercase values are still caught.
  - '(?i)\b(?:password|passwd|secret|api[_-]?key|token)\s*[:=]\s*["'']?(?!(?-i:[A-Z][A-Z0-9_]*)\b)[^\s"''<>]{8,}'
